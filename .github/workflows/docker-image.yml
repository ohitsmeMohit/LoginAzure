name: Docker Image CI

on:
  # push:
  #   branches: [ "master" ]
  # pull_request:
  #   branches: [ "master" ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read
  pull-requests: write
  security-events: write

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag loginimage:$(date +%s)
